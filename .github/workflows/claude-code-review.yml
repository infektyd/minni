name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  # SEC-G9. This workflow also triggers on `synchronize`, which grok-review.yml
  # explicitly declines on cost grounds — so without this, every push to a PR
  # starts another metered review and none of them cancel.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # SEC-G9: same-repo and draft gates, mirroring grok-review.yml. Fork PRs get
    # no secrets, so CLAUDE_CODE_OAUTH_TOKEN below is empty on them and the job
    # can only fail or no-op; drafts are not ready to review. The template's
    # commented-out author filter was left in place with no explanation, which
    # reads as a guard that exists — it does not, and it is replaced by this.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # SEC-G9: without this an agent job can sit at the 6h default.
    timeout-minutes: 20
    permissions:
      contents: read
      # #240: posting a review requires WRITE. With `read` the model did the
      # work, was denied at the post, and the step still exited 0 — 12+ runs
      # reporting success, zero comments ever posted, one permission denial
      # each, ~$0.29 a run. Read permission is what made this check green for
      # work it never delivered.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # An agent reads this checkout and its reply is posted publicly — same threat
          # model as grok-review.yml, and there is no leak gate on this path.
          # Default checkout persists the token into .git/config as an http
          # extraheader; nothing downstream needs it (the repo is public, so
          # any git fetch here is anonymous).
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Assert the review was actually posted
        # #240: the standing rule is that a gate must never pass by not
        # checking. This check reported success 12+ times without ever posting
        # a review, so a green tick meant nothing. The permission fix above is
        # the believed cause; this step is what makes a recurrence VISIBLE
        # rather than silent — if nothing lands on the PR, the check goes red.
        #
        # Deliberately NOT `show_full_output: true`, which #240 suggests for
        # diagnosis: Actions logs are PUBLIC on this repo, and that flag would
        # publish the full SDK transcript.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A formal review bound to this head, or any comment from the app.
          REVIEWS=$(/usr/bin/gh api "repos/${{ github.repository }}/pulls/$PR/reviews?per_page=100" \
            | /usr/bin/jq --arg sha "$HEAD_SHA" \
              '[.[] | select(.user.login | ascii_downcase | startswith("claude"))
                    | select(.commit_id == $sha)] | length')
          COMMENTS=$(/usr/bin/gh api "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
            | /usr/bin/jq '[.[] | select(.user.login | ascii_downcase | startswith("claude"))] | length')
          echo "reviews on $HEAD_SHA: $REVIEWS; comments on PR: $COMMENTS"
          if [ "$REVIEWS" -eq 0 ] && [ "$COMMENTS" -eq 0 ]; then
            echo "::error::Claude Code Review produced no review and no comment. Refusing to report success for a review that was never delivered — see issue #240."
            exit 1
          fi

