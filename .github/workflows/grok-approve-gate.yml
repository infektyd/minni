name: Grok Mechanical Approve Gate

# v2 merge trust: required check run `grok-mechanical-approve`, NOT Reviews API
# APPROVE. Measured 2026-08-01 (#222): bot APPROVE does not clear
# reviewDecision on this user-owned repo.
#
# Re-evaluates on CI completion, on push, and after a review lands, so
# new-SHA / late eligibility / late veto all converge without a metered model
# call. Loads grok_approve_gate.py from the default branch (trust anchor).
#
# CI completion is `workflow_run`, NOT `check_suite`. check_suite does not
# trigger a workflow when the suite was created by GitHub Actions, and every CI
# suite here is Actions-created — so a check_suite trigger would be dead code
# that reads like a working re-evaluation path. Measured on this branch: 40
# runs, 0 of them check_suite. workflow_run does fire, runs from the default
# branch, and is the reason `Resolve PR + head SHA` still handles that event.

on:
  workflow_run:
    # Every workflow that produces a required context, plus the reviewer.
    # Adding a required context without adding its workflow here means the
    # gate stops re-evaluating when that check finishes.
    workflows:
      - "Grok Code Review"
      - "Public CI"
      - "PR Hygiene"
      - "Claude Code Review"
    types: [completed]
    # Branch filters here match the TRIGGERING run's head branch. CI completing
    # on main starts a gate run that resolves main's SHA, finds no open PR and
    # skips — seven such no-ops in one twelve-minute window, once the workflow
    # list above was widened. PR-branch CI still fires, which is the only case
    # that can ever produce a decision.
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Without this, a REQUEST_CHANGES submitted AFTER the check went green never
  # re-evaluates it — the documented veto would not actually revoke merge trust.
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  checks: write
  statuses: read
  # The GITHUB_TOKEN stays read-only on PRs; the mechanical approval is
  # submitted with the App token, never this one.
  pull-requests: read

# Key on head SHA for EVERY event. Keying pull_request on PR number while
# other triggers keyed on SHA put concurrent runs in different groups, so a
# stale snapshot could publish success over a veto that had already landed.
concurrency:
  group: grok-approve-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # Worst case is ~24 API calls x API_TIMEOUT_S(15s) = ~360s across three
    # observation rounds. At 5 minutes the job could be killed mid-decision.
    timeout-minutes: 15
    steps:
      - name: Resolve PR + head SHA
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER_REPO="${{ github.repository }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          SHA=""
          PR=""
          case "${{ github.event_name }}" in
            pull_request|pull_request_review)
              SHA="${{ github.event.pull_request.head.sha }}"
              PR="${{ github.event.pull_request.number }}"
              ;;
            workflow_run)
              SHA="${{ github.event.workflow_run.head_sha }}"
              PR="$(gh api "repos/${OWNER_REPO}/commits/${SHA}/pulls" \
                -H "Accept: application/vnd.github.groot-preview+json" \
                --jq '[.[] | select(.state=="open")][0].number // empty')"
              ;;
          esac
          if [ -z "${SHA}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No head SHA; skipping."
            exit 0
          fi
          if [ -z "${PR}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No open PR for ${SHA}; skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch (trust scripts only)
        if: steps.meta.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # Nothing here needs git auth: the gate talks to the API via gh/env tokens.
          # Default checkout persists the token into .git/config as an http
          # extraheader; nothing downstream needs it (the repo is public, so
          # any git fetch here is anonymous).
          persist-credentials: false
          ref: ${{ steps.meta.outputs.default_branch }}
          fetch-depth: 1

      # The check run must be posted by the Grok App, not GITHUB_TOKEN: branch
      # protection matches a required context by NAME, and any same-repo
      # workflow with `checks: write` can mint that name under the GitHub
      # Actions app. Posting under the App lets protection bind the context to
      # its app_id, which a GITHUB_TOKEN check cannot satisfy.
      - name: Mint GitHub App installation token
        id: app-token
        if: steps.meta.outputs.skip != 'true' && vars.GROK_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GROK_APP_ID }}
          private-key: ${{ secrets.GROK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Least privilege: this token POSTs the check run and READS branch
          # protection, nothing else. With no permission-* inputs the minted
          # token would carry EVERY installation permission.
          permission-checks: write
          # GITHUB_TOKEN cannot be granted this at all, which is why the
          # protection read goes through the App token.
          permission-administration: read
          # NO permission-pull-requests: the mechanical APPROVE moved to the
          # relay USER token, because a GitHub App's approval does not satisfy
          # required_approving_review_count (measured on #243). The App token
          # now only posts the check and reads protection.

      - name: Run mechanical gate
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # Fine-grained PAT on the relay USER (minni-only, Pull requests RW).
          # A user with write access is the ONLY identity whose approval counts
          # toward required_approving_review_count. Unset degrades gracefully:
          # the check still posts, the approval is skipped with a named line.
          RELAY_APPROVE_TOKEN: ${{ secrets.RELAY_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          TRUST_REF="${{ steps.meta.outputs.default_branch }}"
          # Prefer the checked-out default branch copy; fail closed if missing.
          if [ ! -f .github/scripts/grok_approve_gate.py ]; then
            echo "::error::grok_approve_gate.py missing on ${TRUST_REF}"
            exit 1
          fi
          python3 .github/scripts/grok_approve_gate.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.meta.outputs.pr }}" \
            --head-sha "${{ steps.meta.outputs.sha }}" \
            --base-branch "${TRUST_REF}"
