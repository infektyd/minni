name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # `assigned` removed alongside the author gate below: on that event the
    # gate reads the ISSUE AUTHOR's association, never the assigner's, so it
    # could only ever fire for collaborator-authored issues — which `opened`
    # already covers. The delegation case it existed for (a maintainer assigns
    # an outsider's issue to the agent) is exactly what the gate must refuse,
    # since it would spend the token on outsider-authored content. Leaving the
    # trigger would be dead config that reads as a working path.
    types: [opened]
  pull_request_review:
    types: [submitted]

concurrency:
  # SEC-G9: the Grok pair has had this since #215; the Claude pair never did.
  # Two rapid @claude mentions on the same issue otherwise run two metered
  # agents concurrently over the same context.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # SEC-G9: author-association gate, mirroring grok.yml. Without it any
    # drive-by commenter could spend the CLAUDE_CODE_OAUTH_TOKEN below.
    # claude-code-action is believed to enforce an actor write-permission check
    # internally, but that is UNVERIFIED here and is not a reason to omit the
    # guard the Grok counterpart carries.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association
               || github.event.review.author_association
               || github.event.issue.author_association) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    # SEC-G9: an agent job with no timeout can sit at the 6h default.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # An agent reads this checkout and its reply is posted publicly — same threat
          # model as grok-review.yml, and there is no leak gate on this path.
          # Default checkout persists the token into .git/config as an http
          # extraheader; nothing downstream needs it (the repo is public, so
          # any git fetch here is anonymous).
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

