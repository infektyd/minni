name: UsageDock
options:
  bundleIdPrefix: app.minni
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages: {}

targets:
  UsageDock:
    type: application
    platform: macOS
    sources:
      - path: Sources/UsageDockCore
      - path: Sources/UsageDock
        excludes:
          - Resources/Info.plist
      - path: Sources/UsageDock/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.minni.UsageDock
        PRODUCT_NAME: UsageDock
        INFOPLIST_FILE: Sources/UsageDock/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/UsageDock/Resources/UsageDock.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Sources/UsageDock/Resources/UsageDock.entitlements
    scheme:
      testTargets:
        - UsageDockCoreTests

  UsageDockCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UsageDockCoreTests
      - path: Sources/UsageDockCore
      - path: Sources/UsageDock/Adapters/ClaudeCredentials.swift
    dependencies:
      - target: UsageDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.minni.UsageDockTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UsageDock.app/Contents/MacOS/UsageDock"
        BUNDLE_LOADER: "$(TEST_HOST)"
