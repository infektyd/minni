# Depot CI copy of .github/workflows/pr-hygiene.yml.
# Origin's required check is PR Hygiene (pull_request:pr-hygiene.yml). Depot
# registers pull_request triggers from .depot/workflows/ on the default branch.
# Keep the workflow `name:` stable — protection matches it.
#
# Depot CI Migration
# Source: .github/workflows/pr-hygiene.yml
# Changes: ubuntu-latest → depot-ubuntu-latest (Depot sandbox label).
# FORBIDDEN_CONTENT_PATTERN must exist as a Depot secret for same-repo PRs
# (same fail-closed rule as the GitHub copy).

name: PR Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-files:
    name: Forbidden Files
    # Consumes the content verdict so the split does not DE-REQUIRE it.
    # "Forbidden Content" is not in branch protection's required set (checked:
    # Forbidden Files, Free public cloud smoke, grok-mechanical-approve), so
    # splitting alone would have moved a blocking failure onto a context nobody
    # enforces — a content hit would then merge. `always()` is required because
    # a skipped dependency otherwise skips this job too.
    needs: forbidden-content
    # NOT the bare default: a skipped dependency skips the dependent, and a
    # skipped required check counts as SATISFIED — fork PRs would then get no
    # hygiene gate at all. `!cancelled()` keeps this job running when the
    # content job is skipped or failed, while letting a genuinely cancelled run
    # stay cancelled instead of turning every superseded run red.
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs git over PR-authored refs; merge-base/diff are local reads
          # and need no credential.
          # Default checkout persists the token into .git/config as an http
          # extraheader; nothing downstream needs it (the repo is public, so
          # any git fetch here is anonymous).
          persist-credentials: false
          fetch-depth: 0

      - name: Scan PR for forbidden file additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # File patterns that should never be added to the repo (extended regex).
          PATTERNS=(
            # PR-description scratch (the Jules / agent failure mode that triggered this gate)
            '(^|/)pr_description\.[^/]+$'
            '(^|/)PR_DESCRIPTION\.[^/]+$'
            # Generic scratch / temp / backup files (any extension)
            '\.scratch\.[^/]+$'
            '\.tmp\.[^/]+$'
            '\.bak$'
            '~$'
            # OS junk
            '(^|/)\.DS_Store$'
            '(^|/)Thumbs\.db$'
            # Secrets — block any .env except .env.example / .env.sample / .env.template
            '(^|/)\.env(\..*)?$'
            # Top-level scratch notes (any extension)
            '^notes\.[^/]+$'
            '^TODO\.[^/]+$'
            '^scratch\.[^/]+$'
          )

          # Explicit allowlist (matched before the deny patterns).
          ALLOW=(
            '(^|/)\.env\.example$'
            '(^|/)\.env\.sample$'
            '(^|/)\.env\.template$'
          )

          # Resolve the merge base so we only flag paths this PR actually introduces.
          # Comparing tip-to-tip (BASE_SHA ↔ HEAD_SHA) would falsely report files that
          # main has since deleted but the branch left untouched. Including renames
          # (R*) catches the case where an existing file is renamed into a forbidden
          # path (e.g. notes.md → pr_description.md) — the destination is treated as
          # an addition.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          ADDED=$(git diff --name-status --diff-filter=AR "$MERGE_BASE" "$HEAD_SHA" \
            | awk -F'\t' '
                /^A\t/  { print $2 }
                /^R[0-9]*\t/ { print $3 }
              ' || true)

          if [ -z "$ADDED" ]; then
            echo "✓ No new files added (vs merge base $MERGE_BASE)."
            exit 0
          fi

          echo "New paths in PR (vs merge base $MERGE_BASE):"
          echo "$ADDED" | sed 's/^/  /'
          echo "---"

          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            allowed=0
            for a in "${ALLOW[@]}"; do
              if echo "$file" | grep -E -q "$a"; then allowed=1; break; fi
            done
            [ "$allowed" -eq 1 ] && continue
            for p in "${PATTERNS[@]}"; do
              if echo "$file" | grep -E -q "$p"; then
                VIOLATIONS="${VIOLATIONS}  ${file}  (matched: ${p})"$'\n'
                break
              fi
            done
          done <<< "$ADDED"

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::PR hygiene check failed — forbidden files detected:"
            printf '%s' "$VIOLATIONS"
            cat <<'MSG'

            These files should not be committed:
              - PR descriptions belong in the GitHub PR body, not in tracked files.
              - Scratch / temp / backup files belong in your local workspace only.
              - .env files contain secrets — use .env.example as the tracked template.
              - OS junk (.DS_Store, Thumbs.db) belongs in .gitignore.

            Remove these from your branch (git rm + commit + push) and the check
            will re-run automatically.
          MSG
            exit 1
          fi

          echo "✓ No forbidden files in PR diff."

      - name: Require the content gate verdict
        # Deliberately NOT a duplicate of the content job: it re-publishes that
        # job's conclusion through the context branch protection actually
        # enforces. `skipped` is called out rather than passed silently —
        # GitHub treats a skipped job as SATISFYING a required check, so a skip
        # is honest reporting, never enforcement.
        env:
          CONTENT_RESULT: ${{ needs.forbidden-content.result }}
        run: |
          set -euo pipefail
          case "$CONTENT_RESULT" in
            success)
              echo "✓ Content gate passed."
              ;;
            skipped)
              echo "::warning::Content gate did not run: fork PRs get no access to the pattern secret. This check covers FILE ADDITIONS only for this PR — added lines were not scanned."
              ;;
            *)
              echo "::error::Content gate concluded '$CONTENT_RESULT' — refusing to report success for a scan that did not pass."
              exit 1
              ;;
          esac


  # SPLIT OUT of forbidden-files deliberately (SEC-G4). This scan reads a repo
  # SECRET, and GitHub withholds secrets from fork PRs — so while it lived
  # inside `forbidden-files` it exited 0 on exactly the PRs it exists for,
  # inside the ONLY check required for merge. A green "Forbidden Files" then
  # meant two different things depending on who opened the PR.
  #
  # As its own job the fork case becomes a GitHub-level `skipped` conclusion,
  # visible on the PR as a distinct outcome rather than a green tick for a scan
  # that did not run.
  #
  # Be precise about what that buys: REPORTING honesty, not enforcement.
  # GitHub counts a skipped job as SATISFYING a required check, so making this
  # context required would not block a fork PR either. Enforcement for
  # same-repo PRs is preserved by `forbidden-files` consuming this job's result
  # through the context branch protection does enforce.
  forbidden-content:
    name: Forbidden Content
    # Fork PRs get no secrets, so the scan cannot run. Skipping at job level
    # reports that honestly; the alternative (exit 0 inside the step) reports
    # success.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs git over PR-authored refs; merge-base/diff are local reads
          # and need no credential.
          # Default checkout persists the token into .git/config as an http
          # extraheader; nothing downstream needs it (the repo is public, so
          # any git fetch here is anonymous).
          persist-credentials: false
          fetch-depth: 0

      - name: Scan PR added lines for forbidden content pattern
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Set out-of-band as a repo SECRET (not literal text in this file,
          # and not an Actions variable: the runner echoes env values into the
          # public run log, and only secrets are auto-masked there). Unset on
          # forks/CI without the secret — the step must skip, not hard-fail,
          # so external contributors are unaffected.
          FORBIDDEN_CONTENT_PATTERN: ${{ secrets.FORBIDDEN_CONTENT_PATTERN }}
        run: |
          set -euo pipefail

          if [ -z "${FORBIDDEN_CONTENT_PATTERN:-}" ]; then
            # Reached only on a SAME-REPO PR, because the job-level `if` above
            # already skipped this check for forks. A same-repo PR that cannot
            # read the secret is a misconfiguration, not an external
            # contributor — and the standing rule is that a gate must never
            # pass by not checking. Fail loudly instead of exiting 0.
            echo "::error::FORBIDDEN_CONTENT_PATTERN is unset on a same-repo PR — the content gate cannot run, and will not report success for work it did not do."
            exit 1
          fi

          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          # Walk the unified, zero-context diff ourselves (rather than
          # `grep -n` on `git diff`) so we can report only `file:line` on a
          # hit. This is a PUBLIC repo with PUBLIC Actions logs: the matching
          # line content, and the pattern itself, must never be printed.
          HITS=""
          current_file=""
          current_line=""
          while IFS= read -r diff_line; do
            case "$diff_line" in
              "+++ "*)
                current_file="${diff_line#+++ b/}"
                ;;
              "@@ "*)
                # Hunk header: "@@ -a,b +c,d @@ ...". c is the first new-file
                # line number; strip down to it to track line numbers as we
                # walk subsequent "+" lines.
                new_range="${diff_line#*+}"
                new_range="${new_range%% *}"
                current_line="${new_range%%,*}"
                ;;
              "+"*)
                if printf '%s' "${diff_line#+}" | grep -E -q "$FORBIDDEN_CONTENT_PATTERN"; then
                  HITS="${HITS}  ${current_file}:${current_line}"$'\n'
                fi
                current_line=$((current_line + 1))
                ;;
            esac
          done < <(git diff -U0 "$MERGE_BASE" "$HEAD_SHA")

          if [ -n "$HITS" ]; then
            echo "::error::PR hygiene content gate failed — forbidden pattern matched added lines."
            echo "Matches (file:line only — matching content is withheld from public logs):"
            printf '%s' "$HITS"
            exit 1
          fi

          echo "✓ No forbidden content pattern in added lines."
